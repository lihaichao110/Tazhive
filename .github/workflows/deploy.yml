name: 部署生产环境

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: 检查、构建并部署
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 安装、检查并构建
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm build

      - name: 配置服务器指纹
        shell: bash
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh_known_hosts"

      - name: 部署到服务器
        uses: easingthemes/ssh-deploy@v6.0.3
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          REMOTE_PORT: ${{ secrets.SSH_PORT || '22' }}
          SOURCE: dist/
          TARGET: ${{ secrets.DEPLOY_PATH }}
          ARGS: '-rlgoDzvc -i --delete'
          # ssh-deploy 默认关闭主机校验，这里强制使用预先核验的指纹文件。
          SSH_CMD_ARGS: '-o StrictHostKeyChecking=yes,-o UserKnownHostsFile=${{ runner.temp }}/ssh_known_hosts'
